url: https://alexandercoppock.com/excheckr/

template:
  bootstrap: 5
  theme: gruvbox-light
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  bslib:
    primary: '#a72f5b'
    body-bg: '#FBFAF7'
    body-color: '#3C444C'
    link-color: '#a72f5b'
    link-hover-color: '#7d2244'
    border-color: '#E4E0D8'
    muted-color: '#6B7078'
    rule-color: '#E4E0D8'
    rule-strong: '#D6D1C6'
    accent-teal: '#004c6d'
    code-bg: '#F3EFE7'
    border-radius: '2px'
    btn-border-radius: '2px'
    font-size-base: '1.0625rem'
    line-height-base: '1.6'
    font-family-sans-serif: '"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'
    headings-font-family: '"Source Serif 4", Georgia, "Times New Roman", serif'
    font-family-monospace: '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace'
    headings-font-weight: '600'
    code-color: '#004c6d'
reference:
- title: Checking one study
  desc: >
    Run once per cleaned experimental dataset. Each check takes a `study_id`
    and appends it to the output, so results can be stacked across studies.
  contents:
  - check_y_bounds
  - check_missingness_nona
  - check_balance
  - check_smd
  - check_attrition
  - check_covariate_missingness

- title: Checking many studies
  desc: >
    Collapse per-study results and read them without over-reading them. Balance
    p-values are uniform under a valid design, so a count of flags is the wrong
    summary; the distribution is the right one.
  contents:
  - stack_checks
  - report_checks
  - summarize_check_pvalues
  - plot_check_pvalues

- title: Data shape
  desc: >
    Check that a cleaned dataset has the structure a pipeline expects, as
    distinct from checking that the experiment behind it was sound.
  contents:
  - check_schema
  - assert_schema
  - assert_key_unique
  - assert_no_labelled

- title: Cleaning helpers
  desc: >
    Utilities for building cleaned data, and code generators that emit
    copy-pasteable cleaning and checking blocks.
  contents:
  - stat_mode
  - scale_by_control
  - check_s_scaling
  - write_covariate_imputation_code
  - write_outcome_missingness_dummies_code
  - write_balance_check_code
  - write_attrition_check_code

- title: Package
  contents:
  - excheckr-package

articles:
- title: Articles
  navbar: ~
  contents:
  - checking_many_studies
  - checking_experiments
  - balance_testing
